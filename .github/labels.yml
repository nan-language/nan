kinds:
  - name: bug
    color: "d73a4a"
    description: "NaN does something wrong, or its specification says something wrong"
  - name: enhancement
    color: "1d76db"
    description: "NaN lacks something: a language feature, a std API, a command or a machine capability"

areas:
  - name: language
    color: "bfdadc"
    description: "The language itself: what NaN source can express and what it means"
  - name: syntax
    color: "bfdadc"
    description: "Source text: lexing, parsing, prefix checking, nan fmt and the merge driver"
  - name: checker
    color: "bfdadc"
    description: "What nan check accepts and rejects: names, types, ownership, effects, contracts and proofs"
  - name: diagnostics
    color: "bfdadc"
    description: "How problems are reported: codes, locations, wording, reasons, cascades and offered fixes"
  - name: lowering
    color: "bfdadc"
    description: "Final builds and test images: lowering, code generation, linking and reused cached code"
  - name: testing
    color: "bfdadc"
    description: "Tests and nan test: test items, test runs, the seeded scheduler, simulated capabilities, replays"
  - name: workspace
    color: "bfdadc"
    description: "Packages and releases: dependencies, locks, the local store, API snapshots, seals, nan verify"
  - name: runtime
    color: "bfdadc"
    description: "The support routines images run: tasks, scheduling, domains, traps, capabilities, memory"
  - name: std
    color: "bfdadc"
    description: "The API and behaviour of the std packages"
  - name: machine
    color: "bfdadc"
    description: "Machine targets: boot, devices, interrupts, CPU features, UEFI programs and the emulator"

impacts:
  - name: internal-error
    color: "d93f0b"
    description: "The toolchain stops with internal.invariant instead of giving its result"
  - name: soundness
    color: "5319e7"
    description: "A guarantee does not hold: a rule goes unchecked, or code does what the specification rules out"
  - name: performance
    color: "fbca04"
    description: "Checking, building or running takes more time or memory than it should"

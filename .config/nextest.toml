nextest-version = { required = "0.9.148" }

[profile.default]
status-level = "fail"
final-status-level = "fail"
failure-output = "final"
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 3 }

[[profile.default.overrides]]
filter = "binary(conformance) or (binary(nan) and test(/^command::/))"
slow-timeout = { period = "10s", terminate-after = 9 }

[[profile.default.overrides]]
filter = "binary(measurements)"
slow-timeout = { period = "10s", terminate-after = 9 }

[[profile.default.overrides]]
filter = "binary(milestones) and test(=m4)"
slow-timeout = { period = "10s", terminate-after = 30 }

[[profile.default.overrides]]
filter = "binary(self_check) and test(/^toolchain/)"
slow-timeout = { period = "60s", terminate-after = 240 }

[[profile.default.overrides]]
filter = "binary(self_check)"
slow-timeout = { period = "60s", terminate-after = 60 }

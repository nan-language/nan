name: Labels

on:
  push:
    branches: [main]
    paths: [.github/labels.yml, .github/workflows/labels.yml]

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Make the repository's labels those of labels.yml
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(yq -o=json . .github/labels.yml | jq '[.[][]]')
          jq -r '.[] | [.name, .color, .description] | @tsv' <<< "$labels" |
            while IFS=$'\t' read -r name color description; do
              gh label create "$name" --color "$color" --description "$description" --force
            done
          gh label list --limit 1000 --json name --jq '.[].name' |
            while read -r name; do
              jq -e --arg name "$name" 'any(.[]; (.name | ascii_downcase) == ($name | ascii_downcase))' <<< "$labels" > /dev/null ||
                gh label delete "$name" --yes
            done

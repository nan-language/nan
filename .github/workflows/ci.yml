name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/0.9.148/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy -q --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo nextest run --cargo-quiet

name: Linux toolchain

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag naming the images to upload; none uploads nothing
        type: string
        default: ''

jobs:
  toolchain:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    name: toolchain-${{ matrix.arch }}-linux
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-linux
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        working-directory: bootstrap
        run: rustup toolchain install
      - if: inputs.tag == ''
        name: Install cargo-nextest
        run: curl -LsSf --retry 5 --retry-all-errors https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-${{ matrix.arch }}-unknown-linux-gnu.tar.gz | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bootstrap/target
            !bootstrap/target/tmp
          key: linux-${{ matrix.arch }}-${{ hashFiles('bootstrap/rust-toolchain.toml', 'bootstrap/Cargo.lock') }}-${{ github.sha }}
          restore-keys: linux-${{ matrix.arch }}-${{ hashFiles('bootstrap/rust-toolchain.toml', 'bootstrap/Cargo.lock') }}-
      # The self-check harness compares the toolchain with the bootstrap on its workspace before
      # double-compiling it.
      - if: inputs.tag == ''
        name: Run the Linux programs and double-compile the NaN toolchain
        working-directory: bootstrap
        run: cargo nextest run --cargo-quiet --profile ci -p nan --test programs --test self_check -E '(binary(programs) and test(/\/${{ matrix.arch }}-linux$/)) or (binary(self_check) and test(/^toolchain/))'
      - if: inputs.tag != ''
        name: Build the bootstrap
        working-directory: bootstrap
        run: cargo build --release -q -p nan
      - if: inputs.tag != ''
        name: Declare the Linux target of the runner's architecture
        run: |
          sed -i "s/^    targets x86_64-linux\$/    targets $TARGET/" toolchain/nan/package.nan
          grep -q "^    targets $TARGET\$" toolchain/nan/package.nan
      # Each stage builds a fresh copy of toolchain/ with an empty user directory, so that no
      # stage reuses another's proofs; the second and third stages must be equal byte for byte,
      # and the bootstrap's stage comparison must accept the second.
      - if: inputs.tag != ''
        name: Build the NaN toolchain three times
        run: |
          stage() {
            rm -rf ~/.nan "$RUNNER_TEMP/$2"
            cp -r toolchain "$RUNNER_TEMP/$2"
            (cd "$RUNNER_TEMP/$2" && "$1" build nan)
            cp "$RUNNER_TEMP/$2/.nan/images/$TARGET/nan" "$RUNNER_TEMP/$2.image"
          }
          stage "$GITHUB_WORKSPACE/bootstrap/target/release/nan" first
          stage "$RUNNER_TEMP/first.image" second
          stage "$RUNNER_TEMP/second.image" third
          cmp "$RUNNER_TEMP/second.image" "$RUNNER_TEMP/third.image"
          rm -rf ~/.nan "$RUNNER_TEMP/compared"
          cp -r toolchain "$RUNNER_TEMP/compared"
          (cd "$RUNNER_TEMP/compared" && "$GITHUB_WORKSPACE/bootstrap/target/release/nan" build nan --compare-with "$RUNNER_TEMP/second.image")
          cp "$RUNNER_TEMP/second.image" "nan-${{ inputs.tag }}-$TARGET"
      - if: inputs.tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: nan-${{ inputs.tag }}-${{ env.TARGET }}
          path: nan-${{ inputs.tag }}-${{ env.TARGET }}
          if-no-files-found: error
      - if: always() && inputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux-${{ matrix.arch }}
          path: bootstrap/target/nextest/ci/junit.xml

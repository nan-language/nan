name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: bootstrap

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bootstrap/target
            !bootstrap/target/tmp
          key: lint-${{ hashFiles('bootstrap/rust-toolchain.toml', 'bootstrap/Cargo.lock') }}-${{ github.sha }}
          restore-keys: lint-${{ hashFiles('bootstrap/rust-toolchain.toml', 'bootstrap/Cargo.lock') }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy -q --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test-${{ matrix.shard }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install cargo-nextest
        run: curl -LsSf --retry 5 --retry-all-errors https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-gnu.tar.gz | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - name: Install the emulators, the TPM emulator and the AArch64 cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64 swtpm wine gcc-aarch64-linux-gnu
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bootstrap/target
            !bootstrap/target/tmp
          key: test-${{ hashFiles('bootstrap/rust-toolchain.toml', 'bootstrap/Cargo.lock') }}-${{ github.sha }}
          restore-keys: test-${{ hashFiles('bootstrap/rust-toolchain.toml', 'bootstrap/Cargo.lock') }}-
      - name: Build
        run: cargo nextest run --cargo-quiet --no-run
      - if: matrix.shard == 1
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bootstrap/target
            !bootstrap/target/tmp
          key: test-${{ hashFiles('bootstrap/rust-toolchain.toml', 'bootstrap/Cargo.lock') }}-${{ github.sha }}
      - name: Test
        run: cargo nextest run --cargo-quiet --profile ci --partition count:${{ matrix.shard }}/4 -E 'not (binary(self_check) and test(/^toolchain/))'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-${{ matrix.shard }}
          path: bootstrap/target/nextest/ci/junit.xml

  toolchain:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    name: toolchain-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install cargo-nextest
        run: curl -LsSf --retry 5 --retry-all-errors https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-${{ matrix.target }}.tar.gz | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bootstrap/target
            !bootstrap/target/tmp
          key: toolchain-${{ matrix.arch }}-${{ hashFiles('bootstrap/rust-toolchain.toml', 'bootstrap/Cargo.lock') }}-${{ github.sha }}
          restore-keys: toolchain-${{ matrix.arch }}-${{ hashFiles('bootstrap/rust-toolchain.toml', 'bootstrap/Cargo.lock') }}-
      - name: Double-compile the NaN toolchain
        run: cargo nextest run --cargo-quiet --profile ci -p nan --test self_check -E 'test(/^toolchain/)'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-toolchain-${{ matrix.arch }}
          path: bootstrap/target/nextest/ci/junit.xml

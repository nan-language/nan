name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.arch }}-host
      IMAGE: nan-${{ github.ref_name }}-${{ matrix.arch }}-linux
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$TAG is not vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main"; exit 1; }
      - name: Install the pinned toolchain
        working-directory: bootstrap
        run: rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bootstrap/target
          key: release-${{ matrix.arch }}-${{ hashFiles('bootstrap/rust-toolchain.toml', 'bootstrap/Cargo.lock') }}
      - name: Build the bootstrap
        working-directory: bootstrap
        run: cargo build --release -q -p nan
      - name: Declare the host target of the runner's architecture
        run: |
          sed -i "s/^    targets x86_64-host\$/    targets $TARGET/" toolchain/nan/package.nan
          grep -q "^    targets $TARGET\$" toolchain/nan/package.nan
      # Each stage builds a fresh copy of toolchain/ with an empty user directory, so that no
      # stage reuses another's proofs; the second and third stages must be equal byte for byte,
      # and the bootstrap's stage comparison must accept the second.
      - name: Build the NaN toolchain three times
        run: |
          stage() {
            rm -rf ~/.nan "$RUNNER_TEMP/$2"
            cp -r toolchain "$RUNNER_TEMP/$2"
            (cd "$RUNNER_TEMP/$2" && "$1" build nan)
            cp "$RUNNER_TEMP/$2/.nan/images/$TARGET/nan" "$RUNNER_TEMP/$2.image"
          }
          stage "$PWD/bootstrap/target/release/nan" first
          stage "$RUNNER_TEMP/first.image" second
          stage "$RUNNER_TEMP/second.image" third
          cmp "$RUNNER_TEMP/second.image" "$RUNNER_TEMP/third.image"
          rm -rf ~/.nan "$RUNNER_TEMP/compared"
          cp -r toolchain "$RUNNER_TEMP/compared"
          (cd "$RUNNER_TEMP/compared" && "$GITHUB_WORKSPACE/bootstrap/target/release/nan" build nan --compare-with "$RUNNER_TEMP/second.image")
      - name: Identify the image
        run: |
          cp "$RUNNER_TEMP/second.image" "$IMAGE"
          sha256sum "$IMAGE" > "$IMAGE.sha256"
          objcopy --dump-section .nan.tree="$RUNNER_TEMP/tree" "$IMAGE"
          od -An -tx1 -v "$RUNNER_TEMP/tree" | tr -d ' \n' > "$IMAGE.tree"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE }}
          path: ${{ env.IMAGE }}*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Write the release notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "The NaN toolchain built by itself, for Linux on x86_64 and on AArch64 (each image links the system C library)."
            for image in "nan-$TAG-x86_64-linux" "nan-$TAG-aarch64-linux"; do
              echo
              echo "## $image"
              echo
              echo "- SHA-256: \`$(cut -d' ' -f1 "$image.sha256")\`"
              echo "- Source tree hash (\`.nan.tree\`, hexadecimal): \`$(cat "$image.tree")\`"
            done
            echo
            echo "## Changes"
            echo
            git log --format='- %s' "${previous:+$previous..}$TAG"
          } > "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" nan-"$TAG"-*-linux nan-"$TAG"-*-linux.sha256 --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

  aur:
    needs: publish
    runs-on: ubuntu-26.04
    container: archlinux:base-devel
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # Building the package checks the published assets against the SHA-256 of the built images.
      - name: Write the package
        run: |
          useradd -m builder
          install -d -o builder /home/builder/nan-bin
          sed -e "s/@VERSION@/${TAG#v}/" \
              -e "s/@SHA256_X86_64@/$(cut -d' ' -f1 "nan-$TAG-x86_64-linux.sha256")/" \
              -e "s/@SHA256_AARCH64@/$(cut -d' ' -f1 "nan-$TAG-aarch64-linux.sha256")/" \
              .github/aur/PKGBUILD > /home/builder/nan-bin/PKGBUILD
          cd /home/builder/nan-bin
          runuser -u builder -- makepkg
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
      - name: Push the package to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          pacman -Syu --noconfirm --needed git openssh
          install -m 600 /dev/null "$RUNNER_TEMP/aur_key"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/aur_key"
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$RUNNER_TEMP/aur_known_hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/aur_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/aur_known_hosts"
          git clone ssh://aur@aur.archlinux.org/nan-bin.git "$RUNNER_TEMP/aur"
          cp /home/builder/nan-bin/PKGBUILD /home/builder/nan-bin/.SRCINFO "$RUNNER_TEMP/aur"
          cd "$RUNNER_TEMP/aur"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "Update to ${TAG#v}"
          git push origin HEAD:master

  copr:
    needs: publish
    runs-on: ubuntu-26.04
    container: fedora:latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Write the source package
        run: |
          dnf install -y -q rpm-build copr-cli
          sed -e "s/@VERSION@/${TAG#v}/" -e "s/@DATE@/$(date -u '+%a %b %d %Y')/" .github/copr/nan.spec > nan.spec
          rpmbuild -bs nan.spec --define "_sourcedir $PWD" --define "_srcrpmdir $PWD"
      # copr-cli waits for the builds of every chroot of the project and fails when one fails.
      - name: Build the package in Copr
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/copr"
          printf '%s\n' "$COPR_CONFIG" > "$RUNNER_TEMP/copr"
          copr-cli --config "$RUNNER_TEMP/copr" build @nanlang/nan nan-*.src.rpm

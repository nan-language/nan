name: Kernel and macOS stalls

on:
  push:
    branches: [claude/charming-mendel-sppvb1]
  workflow_dispatch:

jobs:
  kernel:
    strategy:
      fail-fast: false
      matrix:
        hunter: [1, 2]
    name: hunt-kernel-steals-${{ matrix.hunter }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        working-directory: bootstrap
        run: rustup toolchain install
      - name: Install the emulator and the TPM emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 swtpm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          qemu-system-x86_64 --version
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bootstrap/target
            !bootstrap/target/tmp
          key: test-${{ hashFiles('bootstrap/rust-toolchain.toml', 'bootstrap/Cargo.lock') }}-${{ github.sha }}
          restore-keys: test-${{ hashFiles('bootstrap/rust-toolchain.toml', 'bootstrap/Cargo.lock') }}-
      - name: Build the bootstrap
        working-directory: bootstrap
        run: cargo build -q -p nan
      - name: Boot kernel_steals until one stalls
        run: .github/diag/kernel_hunt.sh "$GITHUB_WORKSPACE/bootstrap/target/debug/nan" "$RUNNER_TEMP/hunt" 20
      - name: Show the stalls
        if: always()
        run: for f in "$RUNNER_TEMP"/hunt/*.dump.txt; do [ -f "$f" ] && { echo "== $f"; head -c 20000 "$f"; }; done
